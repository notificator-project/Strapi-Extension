name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: >-
          node -e "const version = require('./package.json').version;
          const tag = process.env.GITHUB_REF_NAME;
          if (tag !== 'v' + version) {
            throw new Error('Release tag ' + tag + ' does not match package version v' + version);
          }"

      - name: Check npm registry
        id: registry
        run: |
          package_spec=$(node -p "const { name, version } = require('./package.json'); name + '@' + version")
          if npm view "$package_spec" version --json > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$package_spec is already available on npm; skipping publication."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.registry.outputs.published != 'true'
        run: npm publish
